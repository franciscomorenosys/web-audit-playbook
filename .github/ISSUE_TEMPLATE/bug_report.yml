name: Reporte de bug
description: Algo del toolkit o de la documentación no se comporta como debería.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. Antes de seguir, dos avisos:

        1. **No incluyas datos de clientes, de pacientes ni credenciales reales**
           en este reporte. Si hace falta un ejemplo, usa datos sintéticos.
        2. **Este issue no es un encargo de auditoría.** Si lo que quieres es
           auditar un sistema, eso se hace con RoE firmado: ver
           [`SECURITY.md`](https://github.com/franciscomorenosys/web-audit-playbook/blob/main/SECURITY.md).

  - type: input
    id: componente
    attributes:
      label: Componente
      description: ¿Dónde está el problema?
      placeholder: "01-tooling/scripts/pii_redact.py · 00-metodologia/ciclo-de-auditoria.md · CI"
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de fallo
      options:
        - El script da un resultado incorrecto
        - El script rompe / lanza una excepción
        - La documentación es incorrecta o está desactualizada
        - La CI falla
        - El script sale del alcance autorizado (problema de seguridad)
        - Otro
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: El comando exacto y la salida que obtienes.
      placeholder: |
        $ python3 01-tooling/scripts/pii_redact.py evidencia/ejemplo.json --out-dir ./out
        Traceback (most recent call last):
          ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
      description: Qué debería haber pasado, según la documentación.
    validations:
      required: true

  - type: textarea
    id: impacto
    attributes:
      label: Impacto
      description: |
        ¿El fallo puede hacer que se filtren datos, se salga del alcance
        autorizado o se pierda una redacción? Sé explícito.
      placeholder: "El dato X no se redacta cuando el valor viene en la clave Y."
    validations:
      required: true

  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      description: Versión de Python, sistema operativo y commit.
      placeholder: |
        Python 3.13.1 · macOS 15.1 (arm64) · commit a1b2c3d
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Antes de enviar
      options:
        - label: He pasado la evidencia por `pii_redact.py` (o no contiene datos personales).
        - label: He confirmado que el problema ocurre también sin datos reales.
        - label: He buscado si ya hay un issue abierto para lo mismo.
